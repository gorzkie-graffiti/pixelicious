<!doctype html>
<html lang="en">
	<head>

		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<meta name="theme-color" content="#0f172a" />

		<!-- Primary Meta Tags -->
		<meta name="title" content="PixelForge — Convert Images to Pixel Art Online" />

			name="description"
			content="Transform your images into pixel art with PixelForge. Upload any image, adjust pixelation levels, and export as PNG. Free, fast, and runs entirely in your browser."
		/>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />

		<meta name="twitter:title" content="PixelForge — Convert Images to Pixel Art Online" />

			name="twitter:description"
			content="Transform your images into pixel art with PixelForge. Upload any image, adjust pixelation levels, and export as PNG. Free, fast, and runs entirely in your browser."
		/>

	</head>

	<body data-sveltekit-preload-data="hover" class="bg-slate-900 overflow-x-hidden">
		<div style="display: contents">%sveltekit.body%</div>
